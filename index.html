<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Linus Bredehorst — Photographer, Berlin</title>
<meta name="description" content="Linus Bredehorst is a photographer based in Berlin, working across portrait, editorial, documentary and commercial photography." />
<meta name="theme-color" content="#FAFAF7" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
/* ============================================================
   LINUS BREDEHORST — PHOTOGRAPHY PORTFOLIO
   ------------------------------------------------------------
   Design system tokens. Everything else inherits from here.
   ============================================================ */
:root {
  --bg:         #FAFAF7;
  --bg-alt:     #F3EFE5;
  --ink:        #141412;
  --ink-soft:   #3A3A36;
  --muted:      #8C8878;
  --hair:       #E6E1D5;
  --placeholder:#EDE8DC;
  --placeholder-grain: #E3DDCE;

  --f-display:  "Instrument Serif", "EB Garamond", Georgia, serif;
  --f-body:     "EB Garamond", Georgia, serif;
  --f-mono:     "JetBrains Mono", ui-monospace, Menlo, monospace;

  --pad-x:      clamp(20px, 4vw, 56px);
  --pad-y:      clamp(80px, 12vh, 180px);

  --ease:       cubic-bezier(.2,.6,.2,1);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.5;
  font-weight: 400;
  overflow-x: hidden;
}
img, picture, video { display: block; max-width: 100%; height: auto; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
::selection { background: var(--ink); color: var(--bg); }

/* ------- Typography utilities ------- */
.display {
  font-family: var(--f-display);
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 0.95;
}
.mono {
  font-family: var(--f-mono);
  font-weight: 400;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.serif-italic { font-family: var(--f-display); font-style: italic; }

/* ============================================================
   NAVIGATION — fixed, paper-thin, minimal
   ============================================================ */
.nav {
  position: fixed; inset: 0 0 auto 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px var(--pad-x);
  z-index: 100;
  background: rgba(250, 250, 247, 0.82);
  backdrop-filter: saturate(1.1) blur(10px);
  -webkit-backdrop-filter: saturate(1.1) blur(10px);
  border-bottom: 1px solid transparent;
  transition: border-color .4s var(--ease);
}
.nav.scrolled { border-bottom-color: var(--hair); }
.nav a.brand {
  font-family: var(--f-display);
  font-size: 19px;
  letter-spacing: -0.005em;
}
.nav ul {
  display: flex; gap: clamp(20px, 3vw, 44px);
  list-style: none; margin: 0; padding: 0;
  align-items: center;
}
.nav ul a {
  position: relative;
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 4px 0;
  color: var(--ink-soft);
  transition: color .3s var(--ease);
}
.nav ul a::after {
  content: "";
  position: absolute; left: 0; right: 100%; bottom: 0;
  height: 1px; background: currentColor;
  transition: right .35s var(--ease);
}
.nav ul a:hover, .nav ul a.active { color: var(--ink); }
.nav ul a.active::after, .nav ul a:hover::after { right: 0; }

/* Mobile menu toggle */
.nav-toggle { display: none; }
@media (max-width: 720px) {
  .nav ul { display: none; }
  .nav.open ul {
    display: flex; flex-direction: column;
    position: absolute; top: 100%; left: 0; right: 0;
    background: var(--bg); padding: 28px var(--pad-x) 40px;
    border-bottom: 1px solid var(--hair);
    gap: 18px; align-items: flex-start;
  }
  .nav.open ul a { font-size: 13px; }
  .nav-toggle {
    display: block;
    font-family: var(--f-mono);
    font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase;
  }
}

/* ============================================================
   PAGE / ROUTE FADE
   ============================================================ */
main { padding-top: 68px; min-height: 100vh; }
.page { animation: fade 520ms var(--ease); }
@keyframes fade {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   PLACEHOLDER IMAGE BLOCKS
   ------------------------------------------------------------
   Used during wireframe stage. Replace the .image-block
   markup with <img src="..." /> when real photos are added.
   ============================================================ */
.image-block {
  position: relative;
  background: var(--placeholder);
  overflow: hidden;
  transition: transform .6s var(--ease);
}
.image-block::before {
  /* subtle grain / paper texture */
  content: "";
  position: absolute; inset: 0;
  background-image:
    radial-gradient(circle at 20% 30%, var(--placeholder-grain) 0.5px, transparent 0.5px),
    radial-gradient(circle at 70% 80%, var(--placeholder-grain) 0.5px, transparent 0.5px),
    radial-gradient(circle at 50% 50%, var(--placeholder-grain) 0.5px, transparent 0.5px);
  background-size: 7px 7px, 11px 11px, 5px 5px;
  opacity: 0.55;
  mix-blend-mode: multiply;
}
.image-block::after {
  content: attr(data-label);
  position: absolute; bottom: 14px; left: 14px;
  font-family: var(--f-mono);
  font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  opacity: 0.85;
}
.image-block img {
  width: 100%; height: 100%; object-fit: cover;
  position: relative; z-index: 2;
}
/* When a real image is loaded, hide the placeholder grain + label */
.image-block:has(img)::before,
.image-block:has(img)::after { display: none; }
.image-block:has(img) { background: transparent; }
.image-frame:hover .image-block { transform: scale(1.008); }
.image-frame { cursor: default; overflow: hidden; }
.seq .image-frame { cursor: zoom-in; }
.selected-item .image-frame { cursor: pointer; }

/* =====================================================================
   LIGHTBOX — click any image to view it at full size (object-fit: contain)
   Keyboard: ESC to close, ←/→ to navigate. Touch: swipe to navigate.
   ===================================================================== */
.lightbox {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(10, 10, 10, 0.96);
  display: none;
  align-items: center; justify-content: center;
  opacity: 0;
  transition: opacity .28s var(--ease);
  cursor: zoom-out;
}
.lightbox.open { display: flex; opacity: 1; }
.lightbox .lb-stage {
  max-width: 96vw; max-height: 90vh;
  display: flex; align-items: center; justify-content: center;
  user-select: none;
}
.lightbox .lb-stage img {
  max-width: 96vw; max-height: 90vh;
  width: auto; height: auto;
  object-fit: contain;
  display: block;
  box-shadow: 0 20px 80px rgba(0,0,0,0.5);
}
.lightbox button {
  position: absolute;
  background: transparent; border: 0;
  color: rgba(255,255,255,0.72);
  font-family: var(--f-mono);
  cursor: pointer;
  transition: color .2s var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.lightbox button:hover { color: #fff; }
.lightbox .lb-close {
  top: 18px; right: 22px;
  font-size: 34px; line-height: 1;
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
}
.lightbox .lb-prev, .lightbox .lb-next {
  top: 50%; transform: translateY(-50%);
  font-size: 48px; line-height: 1;
  width: 60px; height: 80px;
  display: flex; align-items: center; justify-content: center;
}
.lightbox .lb-prev { left: 12px; }
.lightbox .lb-next { right: 12px; }
.lightbox .lb-caption {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.55);
  font-family: var(--f-mono);
  font-size: 10px; letter-spacing: 0.16em;
  text-transform: uppercase;
  max-width: 80vw;
  text-align: center;
  pointer-events: none;
}
.lightbox .lb-counter {
  position: absolute; top: 22px; left: 24px;
  color: rgba(255,255,255,0.4);
  font-family: var(--f-mono);
  font-size: 10px; letter-spacing: 0.18em;
  pointer-events: none;
}
body.lightbox-open { overflow: hidden; }
@media (max-width: 720px) {
  .lightbox .lb-prev, .lightbox .lb-next { font-size: 36px; width: 44px; }
  .lightbox .lb-prev { left: 4px; }
  .lightbox .lb-next { right: 4px; }
  .lightbox .lb-close { top: 10px; right: 10px; }
  .lightbox .lb-stage img { max-width: 100vw; max-height: 82vh; }
}

/* Aspect ratios */
.ar-2-3 { aspect-ratio: 2 / 3; }
.ar-3-4 { aspect-ratio: 3 / 4; }
.ar-4-5 { aspect-ratio: 4 / 5; }
.ar-1-1 { aspect-ratio: 1 / 1; }
.ar-3-2 { aspect-ratio: 3 / 2; }
.ar-4-3 { aspect-ratio: 4 / 3; }
.ar-16-10{ aspect-ratio: 16 / 10; }
.ar-21-9{ aspect-ratio: 21 / 9; }
.ar-5-4 { aspect-ratio: 5 / 4; }

/* ============================================================
   HOME — full-bleed hero image with overlay headline
   ============================================================ */
.home-hero {
  display: block;
  position: relative;
  width: 100%;
  height: calc(100vh - 68px);
  min-height: 620px;
  overflow: hidden;
  cursor: pointer;
  isolation: isolate;
}
.home-hero .image-frame {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  z-index: 1;
}
.home-hero .image-block {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  aspect-ratio: auto;
}
.home-hero img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center 25%;
  display: block;
}

/* dark gradient overlay above the image */
.home-hero-scrim {
  position: absolute;
  inset: 0;
  z-index: 2;
  background:
    linear-gradient(to bottom,
      rgba(10,10,10,0.45) 0%,
      rgba(10,10,10,0.10) 22%,
      rgba(10,10,10,0.10) 55%,
      rgba(10,10,10,0.65) 100%);
  pointer-events: none;
}

.home-hero-overlay {
  position: absolute;
  inset: 0;
  z-index: 3;
  padding: clamp(28px, 5vh, 60px) var(--pad-x);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  color: #fff;
  pointer-events: none;
}
.home-hero-kicker {
  display: flex;
  gap: clamp(16px, 3vw, 40px);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #fff;
  text-shadow: 0 1px 12px rgba(0,0,0,0.6);
}
.home-hero-kicker span { color: #fff; }
.home-hero-kicker span:not(:first-child) { color: rgba(255,255,255,0.75); }
.home-hero-headline {
  font-family: var(--f-display);
  font-weight: 400;
  font-size: clamp(34px, 6.4vw, 96px);
  line-height: 0.96;
  letter-spacing: -0.02em;
  margin: 0;
  max-width: 22ch;
  align-self: flex-start;
  margin-bottom: auto;
  margin-top: clamp(40px, 8vh, 100px);
  text-shadow: 0 2px 24px rgba(0,0,0,0.5);
  color: #fff;
}
.home-hero-headline em {
  font-style: italic;
  color: rgba(255,255,255,0.85);
  font-weight: 400;
}
.home-hero-credit {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #fff;
  text-shadow: 0 1px 12px rgba(0,0,0,0.6);
  border-top: 1px solid rgba(255,255,255,0.35);
  padding-top: 14px;
}
.home-hero-credit span {
  color: #fff;
}
.home-hero-credit span:first-child {
  font-family: var(--f-display);
  font-style: italic;
  font-size: 13px;
  letter-spacing: 0.02em;
  text-transform: none;
}

@media (max-width: 720px) {
  .home-hero { height: 90vh; min-height: 560px; }
  .home-hero-headline {
    font-size: clamp(30px, 9vw, 48px);
    margin-top: 30px;
    max-width: 18ch;
  }
  .home-hero-kicker { font-size: 10px; gap: 14px; }
  .home-hero-credit { font-size: 9px; }
  .home-hero-credit span:first-child { font-size: 12px; }
}
/* Selected Work section on home */
.selected {
  padding: var(--pad-y) var(--pad-x);
}
.section-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 60px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--hair);
}
.section-head h2 {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 400;
  font-size: clamp(24px, 3vw, 34px);
  letter-spacing: -0.005em;
}
.section-head h2 em { font-style: italic; color: var(--ink-soft); }

.selected-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: clamp(28px, 3vw, 48px) clamp(16px, 2vw, 28px);
}

/* Six tiles in a strict 3+3 grid. Each tile spans 2 of 6 cols. */
.selected-item { cursor: pointer; display: block; grid-column: span 2; }

/* Force every tile to the same 4:5 portrait crop regardless of source ratio.
   We override the per-image aspect-ratio class by targeting the cover wrapper. */
.selected-item .cover {
  margin-bottom: 16px;
  position: relative;
}
.selected-item .cover .image-frame,
.selected-item .cover .image-block {
  aspect-ratio: 4 / 5;
  width: 100%;
  height: auto;
}
.selected-item .cover img {
  width: 100%; height: 100%;
  object-fit: cover;
}
.selected-item:hover .cover .image-block { transform: scale(1.005); }

.selected-item .caption {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 14px;
  align-items: baseline;
}
.selected-item .caption .num {
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--muted);
  padding-top: 4px;
}
.selected-item .caption .txt {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 14px;
}
.selected-item .title {
  font-family: var(--f-display);
  font-size: clamp(18px, 1.5vw, 22px);
  line-height: 1.1;
}
.selected-item .sub {
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.12em;
}

/* ---- end selected-grid ---- */

@media (max-width: 860px) {
  .selected-grid { grid-template-columns: repeat(2, 1fr); gap: 32px 14px; }
  .selected-item { grid-column: span 1 !important; }
  .selected-item .title { font-size: 16px; }
  .selected-item .caption { grid-template-columns: 1fr; gap: 6px; }
  .selected-item .caption .num { padding-top: 0; }
  .selected-item .caption .txt { flex-direction: column; gap: 4px; }
}
@media (max-width: 460px) {
  .selected-grid { grid-template-columns: 1fr; gap: 40px; }
  .selected-item { grid-column: 1 !important; }
  .selected-item .cover .image-frame,
  .selected-item .cover .image-block { aspect-ratio: 4 / 5; }
  .selected-item .title { font-size: 20px; }
}

.view-all {
  margin-top: 80px;
  text-align: center;
}
.view-all a {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--ink);
  padding-bottom: 3px;
}

/* ============================================================
   INDEX (projects overview) — editorial contents page
   ============================================================ */
.index-page { padding: clamp(60px, 10vh, 120px) var(--pad-x) var(--pad-y); }
.index-head {
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
  margin-bottom: clamp(60px, 10vh, 120px);
  padding-bottom: 24px;
  border-bottom: 1px solid var(--hair);
}
.index-head h1 {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 400;
  font-size: clamp(48px, 9vw, 140px);
  line-height: 0.92;
  letter-spacing: -0.02em;
}
.index-head h1 em { font-style: italic; color: var(--ink-soft); }
.index-head .intro {
  max-width: 56ch;
  color: var(--ink-soft);
  font-size: 19px;
  line-height: 1.45;
}

.index-table { display: flex; flex-direction: column; }
.index-row {
  display: grid;
  grid-template-columns: 60px 1fr 1fr 140px 60px;
  gap: 24px;
  padding: 26px 0;
  border-bottom: 1px solid var(--hair);
  align-items: baseline;
  position: relative;
  transition: padding .35s var(--ease);
}
.index-row:first-child { border-top: 1px solid var(--hair); }
.index-row .num { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.14em; color: var(--muted); }
.index-row .title {
  font-family: var(--f-display);
  font-size: clamp(28px, 4vw, 46px);
  line-height: 1;
  letter-spacing: -0.01em;
  transition: transform .5s var(--ease);
}
.index-row .title em { font-style: italic; color: var(--ink-soft); }
.index-row .loc { color: var(--muted); font-style: italic; }
.index-row .yr { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.14em; color: var(--muted); }
.index-row .arr { text-align: right; font-family: var(--f-mono); font-size: 14px; color: var(--muted); transition: transform .45s var(--ease), color .3s var(--ease); }
.index-row:hover { padding-left: 12px; }
.index-row:hover .title { color: var(--ink); }
.index-row:hover .arr { transform: translateX(6px); color: var(--ink); }

/* Preview floater on hover (desktop only) */
.index-preview {
  pointer-events: none;
  position: fixed;
  width: 280px; height: 360px;
  z-index: 50;
  opacity: 0;
  transition: opacity .3s var(--ease);
}
.index-preview.visible { opacity: 1; }
.index-preview .image-block { width: 100%; height: 100%; aspect-ratio: auto; }

@media (max-width: 780px) {
  .index-row {
    grid-template-columns: 40px 1fr 40px;
    gap: 14px;
  }
  .index-row .loc, .index-row .yr { display: none; }
  .index-row .title { font-size: 28px; }
  .index-preview { display: none; }
}

/* ============================================================
   PROJECT DETAIL PAGE
   ============================================================ */
.project-head {
  padding: clamp(28px, 4vh, 48px) var(--pad-x) clamp(24px, 3vh, 40px);
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  grid-template-areas:
    "kicker  kicker"
    "title   description"
    "meta    meta";
  gap: 32px clamp(40px, 6vw, 80px);
  align-items: start;
}
.project-head .kicker {
  grid-area: kicker;
  color: var(--muted);
}
.project-head h1 {
  grid-area: title;
  margin: 0;
  font-family: var(--f-display);
  font-weight: 400;
  font-size: clamp(48px, 6.5vw, 96px);
  line-height: 0.92;
  letter-spacing: -0.02em;
}
.project-head h1 em { font-style: italic; color: var(--ink-soft); }
.project-description {
  grid-area: description;
  max-width: 50ch;
  font-size: clamp(15px, 1.15vw, 17px);
  line-height: 1.55;
  color: var(--ink-soft);
  margin: 6px 0 0;
  align-self: start;
}
.project-description p { margin: 0; }
.project-description p + p { margin-top: 0.9em; }

.project-meta {
  grid-area: meta;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px 40px;
  padding-top: 22px;
  border-top: 1px solid var(--hair);
  max-width: 1100px;
}
.project-meta dt {
  font-family: var(--f-mono); font-size: 10px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 4px;
}
.project-meta dd { margin: 0; color: var(--ink); font-size: 15px; }
.project-meta dd.italic { font-style: italic; font-family: var(--f-display); font-size: 18px; color: var(--ink-soft); }

@media (max-width: 860px) {
  .project-head {
    grid-template-columns: 1fr;
    grid-template-areas:
      "kicker"
      "title"
      "description"
      "meta";
    gap: 24px;
  }
  .project-head h1 { font-size: clamp(40px, 9vw, 64px); }
  .project-meta { grid-template-columns: 1fr 1fr; gap: 22px; }
}

/* Image sequence layouts within a project */
.seq { display: flex; flex-direction: column; gap: clamp(14px, 2vw, 32px); }
.seq-section { padding: 0 var(--pad-x); }
.seq-section.full-bleed { padding: 0; }
.seq-section.centered { padding: 0 clamp(var(--pad-x), 8vw, 120px); }

.seq-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: clamp(16px, 2vw, 32px);
}
.seq-pair.asym-l { grid-template-columns: 2fr 1fr; align-items: end; }
.seq-pair.asym-r { grid-template-columns: 1fr 2fr; align-items: start; }
.seq-pair.offset-down > *:nth-child(2) { margin-top: clamp(40px, 8vh, 120px); }
.seq-pair.offset-up > *:nth-child(2) { margin-bottom: clamp(40px, 8vh, 120px); }

.seq-triple {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: clamp(12px, 1.5vw, 24px);
}

@media (max-width: 720px) {
  .seq-pair, .seq-pair.asym-l, .seq-pair.asym-r { grid-template-columns: 1fr; gap: 20px; }
  .seq-triple { gap: 6px; }
  .seq-pair.offset-down > *:nth-child(2), .seq-pair.offset-up > *:nth-child(2) { margin: 0; }
  .seq-section.centered { padding: 0 var(--pad-x); }
}

/* Horizontal scroll mode */
.seq-horizontal {
  display: flex;
  gap: 20px;
  overflow-x: auto;
  padding: 0 var(--pad-x) 40px;
  scroll-snap-type: x mandatory;
  scrollbar-width: thin;
}
.seq-horizontal .image-frame {
  flex: 0 0 auto;
  width: clamp(260px, 40vw, 520px);
  scroll-snap-align: start;
}
.seq-horizontal .image-block { width: 100%; }

/* Grid mode — Linus' rule: portrait max 4 in a row, landscape max 2 in a row */
.seq-grid {
  display: grid;
  /* default: 4-up portrait grid */
  grid-template-columns: repeat(4, 1fr);
  gap: clamp(10px, 1.2vw, 20px);
  padding: 0 var(--pad-x);
}
.seq-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.seq-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.seq-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 1100px) {
  .seq-grid, .seq-grid.cols-4 { grid-template-columns: repeat(3, 1fr); }
  .seq-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 720px) {
  .seq-grid, .seq-grid.cols-4, .seq-grid.cols-3 { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .seq-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 380px) {
  .seq-grid, .seq-grid.cols-4, .seq-grid.cols-3, .seq-grid.cols-2 { grid-template-columns: 1fr; }
}

/* Single full-bleed image — when it's a landscape single, cap height
   to the viewport so the user can see the whole frame on a laptop. */
.seq-section.single-landscape .image-frame {
  display: flex;
  justify-content: center;
}
.seq-section.single-landscape .image-block {
  /* Maintain the natural aspect ratio but never overflow the viewport */
  max-height: calc(100vh - 140px);
  width: auto;
  max-width: 100%;
}
.seq-section.single-landscape .image-block img {
  max-height: calc(100vh - 140px);
  width: auto;
  max-width: 100%;
  object-fit: contain;
}

/* Project navigation (prev / next) */
.project-nav {
  margin-top: var(--pad-y);
  padding: 40px var(--pad-x);
  border-top: 1px solid var(--hair);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 30px;
}
.project-nav .nav-link { display: block; }
.project-nav .nav-link:nth-child(2) { text-align: right; }
.project-nav .lbl {
  color: var(--muted);
  margin-bottom: 10px;
}
.project-nav .tt {
  font-family: var(--f-display);
  font-size: clamp(28px, 4vw, 48px);
  line-height: 1;
}
.project-nav .tt em { font-style: italic; color: var(--ink-soft); }
.project-nav .nav-link:hover .tt { text-decoration: underline; text-underline-offset: 8px; text-decoration-thickness: 1px; }

/* ============================================================
   CHESSBOARD — special layout for the Schach project
   ============================================================ */
.seq-chessboard {
  --board-w: min(96vw, 1100px);
  width: 100%;
  display: flex; flex-direction: column;
  align-items: center;
  padding: clamp(20px, 4vw, 60px) 0;
}
.cb-wrap {
  width: var(--board-w);
  display: grid;
  grid-template-columns: 22px 1fr;
  grid-template-rows: 1fr 22px;
  gap: 6px;
}
.cb-ranks {
  grid-column: 1; grid-row: 1;
  display: grid; grid-template-rows: repeat(8, 1fr);
}
.cb-files {
  grid-column: 2; grid-row: 2;
  display: grid; grid-template-columns: repeat(8, 1fr);
}
.cb-ranks span, .cb-files span {
  display: flex; align-items: center; justify-content: center;
  font-family: var(--f-mono);
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}
.cb-board {
  grid-column: 2; grid-row: 1;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  aspect-ratio: 1 / 1;
  position: relative;
  border: 1px solid var(--hair);
  background: var(--bg);
}
.cb-square {
  position: relative;
  background-color: #efece6;       /* light: warm cream, sitting on the off-white page */
}
.cb-square.dark {
  background-color: #d8d2c4;       /* dark: muted taupe — quiet, not green */
}
.cb-piece {
  position: absolute;
  inset: 6%;
  cursor: zoom-in;
  overflow: hidden;
  background: #111;
  box-shadow:
    0 3px 8px rgba(0, 0, 0, 0.18),
    0 1px 2px rgba(0, 0, 0, 0.12);
  transition: transform .35s var(--ease), box-shadow .35s var(--ease);
}
.cb-piece img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: filter .3s var(--ease);
}
.cb-square:hover .cb-piece {
  transform: translateY(-2px);
  box-shadow:
    0 8px 18px rgba(0, 0, 0, 0.25),
    0 2px 4px rgba(0, 0, 0, 0.15);
  z-index: 5;
}
.cb-square:hover .cb-piece img { filter: brightness(1.05); }

/* Status line under the board */
.cb-status {
  width: var(--board-w);
  margin-top: 18px;
  padding-top: 14px;
  margin-left: 28px;
  border-top: 1px solid var(--hair);
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 24px;
  align-items: baseline;
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  min-height: 24px;
}
.cb-status .cb-sq { color: var(--ink); min-width: 30px; }
.cb-status .cb-title {
  font-family: var(--f-display);
  font-style: italic;
  text-transform: none;
  letter-spacing: 0.01em;
  font-size: 13px;
  color: var(--ink);
}
.cb-status .cb-meta { color: var(--muted); justify-self: end; }

/* Mobile: collapse to a notation list */
@media (max-width: 720px) {
  .cb-wrap, .cb-status { display: none; }
  .cb-mobile-list {
    display: flex; flex-direction: column;
    width: 100%;
    border-top: 1px solid var(--hair);
  }
  .cb-mobile-list .cb-row {
    display: grid;
    grid-template-columns: 80px 1fr 80px;
    gap: 14px;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--hair);
    cursor: zoom-in;
  }
  .cb-mobile-list .cb-row .sq {
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--muted);
  }
  .cb-mobile-list .cb-row .ttl {
    font-family: var(--f-display);
    font-style: italic;
    font-size: 15px;
    line-height: 1.2;
  }
  .cb-mobile-list .cb-row .thumb {
    width: 80px; height: 60px;
    object-fit: cover;
  }
}
.cb-mobile-list { display: none; }

/* ============================================================
   FLOORPLAN — schematic architectural drawing for Tiefkühlschimmel
   Black wall lines on cream paper, doors as gaps with arc swings,
   room labels with sqm, north arrow + plan title block.
   ============================================================ */
.seq-floorplan {
  width: 100%;
  display: flex; flex-direction: column;
  align-items: center;
  padding: clamp(28px, 4vw, 60px) var(--pad-x);
  gap: 0;
}
.fp-wrap {
  width: 100%;
  max-width: 1180px;
  background: #f5f1e8;                  /* warm plan paper */
  background-image:
    repeating-linear-gradient(0deg, transparent 0 39px, rgba(50,40,30,0.022) 39px 40px),
    repeating-linear-gradient(90deg, transparent 0 39px, rgba(50,40,30,0.022) 39px 40px);
  border: 1px solid var(--ink);
  padding: clamp(20px, 3vw, 40px);
  position: relative;
}
/* the actual floor plan grid (inside the paper) */
.fp-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  grid-template-rows: repeat(8, 1fr);
  aspect-ratio: 16 / 10;
  gap: 0;
  position: relative;
  /* outer wall — thick */
  border: 3px solid var(--ink);
  background: transparent;
}
/* a "room" cell — placed via grid-column / grid-row in a per-room class.
   Inner walls are simulated with thin borders on each room, plus thicker
   dividers between certain rooms via box-shadow inset. */
.fp-room {
  position: relative;
  /* thin internal walls */
  outline: 1px solid var(--ink);
  outline-offset: -1px;
  background: transparent;
  display: flex;
  align-items: flex-end;
  justify-content: flex-start;
  overflow: visible;
}
.fp-room.empty { /* no image, just an architectural label */ }
/* the photo "object" inside the room — sits with margin so the walls show */
.fp-room .fp-photo {
  position: absolute;
  inset: 12px;
  overflow: hidden;
  cursor: zoom-in;
  background: #111;
  box-shadow: 0 2px 6px rgba(0,0,0,0.18);
  z-index: 1;
}
.fp-room .fp-photo img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: filter .35s var(--ease), transform .35s var(--ease);
}
.fp-room:hover .fp-photo { box-shadow: 0 6px 14px rgba(0,0,0,0.28); }
.fp-room:hover .fp-photo img { filter: brightness(1.08); }
/* room label (architectural notation) */
.fp-room .fp-label {
  position: absolute;
  top: 6px;
  left: 8px;
  font-family: var(--f-mono);
  font-size: 8px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink);
  background: #f5f1e8;
  padding: 2px 5px;
  z-index: 3;
  pointer-events: none;
}
.fp-room .fp-sqm {
  position: absolute;
  bottom: 6px;
  right: 8px;
  font-family: var(--f-mono);
  font-size: 8px;
  letter-spacing: 0.16em;
  color: var(--ink-soft);
  background: #f5f1e8;
  padding: 1px 4px;
  z-index: 3;
  pointer-events: none;
}

/* Door openings — drawn with absolute-positioned spans on each room
   that punch a "gap" through the wall by overpainting it with paper colour,
   then drawing the arc swing. */
.fp-door {
  position: absolute;
  background: #f5f1e8;
  z-index: 2;
  pointer-events: none;
}
.fp-door.h { /* horizontal door (in a horizontal wall) */
  height: 4px;
  width: 26px;
}
.fp-door.v { /* vertical door (in a vertical wall) */
  width: 4px;
  height: 26px;
}
.fp-door::after {
  /* the arc swing */
  content: "";
  position: absolute;
  border: 1px solid var(--ink);
  border-radius: 50%;
}
.fp-door.h::after {
  width: 26px; height: 26px;
  top: 0; left: 0;
  border-color: transparent transparent var(--ink) transparent;
}
.fp-door.v::after {
  width: 26px; height: 26px;
  top: 0; left: 0;
  border-color: transparent var(--ink) transparent transparent;
}

/* Specific room placements — 12-col × 8-row grid on a 16:10 aspect ratio */
.fp-room.r-balkon       { grid-column: 1 / span 3;  grid-row: 1 / span 2; }
.fp-room.r-kueche       { grid-column: 4 / span 4;  grid-row: 1 / span 3; }
.fp-room.r-bad          { grid-column: 8 / span 2;  grid-row: 1 / span 2; }
.fp-room.r-korridor1    { grid-column: 10 / span 3; grid-row: 1 / span 2; }
.fp-room.r-wohnzimmer1  { grid-column: 1 / span 3;  grid-row: 3 / span 3; }
.fp-room.r-wohnzimmer2  { grid-column: 8 / span 5;  grid-row: 3 / span 3; }
.fp-room.r-korridor2    { grid-column: 4 / span 4;  grid-row: 4 / span 2; }
.fp-room.r-schlafzimmer1{ grid-column: 1 / span 6;  grid-row: 6 / span 3; }
.fp-room.r-schlafzimmer2{ grid-column: 7 / span 4;  grid-row: 6 / span 3; }
.fp-room.r-wohnzimmer3  { grid-column: 11 / span 2; grid-row: 6 / span 3; }

/* North arrow — top right corner of the paper */
.fp-north {
  position: absolute;
  top: 22px; right: 22px;
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--ink);
  border-radius: 50%;
  background: #f5f1e8;
  z-index: 5;
}
.fp-north svg { width: 14px; height: 22px; }
.fp-north .n-letter {
  position: absolute;
  bottom: -16px; left: 50%; transform: translateX(-50%);
  font-family: var(--f-mono);
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--ink);
}

/* Title block — bottom of the paper, like an architect's stamp */
.fp-titleblock {
  margin-top: clamp(14px, 2vw, 22px);
  border: 1px solid var(--ink);
  padding: 10px 14px;
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: 14px;
  font-family: var(--f-mono);
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink);
  background: rgba(255,255,255,0.4);
}
.fp-titleblock .tb-label {
  color: var(--ink-soft);
  font-size: 8px;
  display: block;
  margin-bottom: 3px;
}
.fp-titleblock .tb-val {
  color: var(--ink);
  font-family: var(--f-display);
  font-style: italic;
  text-transform: none;
  letter-spacing: 0.01em;
  font-size: 13px;
}

/* Mobile — paper-style room list */
@media (max-width: 860px) {
  .fp-grid { aspect-ratio: 4 / 5; }
  .fp-room .fp-photo { inset: 6px; }
  .fp-room .fp-label, .fp-room .fp-sqm { font-size: 7px; padding: 1px 3px; }
}
@media (max-width: 720px) {
  .fp-wrap { padding: 14px; }
  .fp-north { top: 12px; right: 12px; width: 30px; height: 30px; }
  .fp-titleblock { grid-template-columns: 1fr 1fr; }
}


/* ============================================================
   LIVE — vertical concert sequence for Acoma
   Dark backdrop, big images, set markers in the margin.
   ============================================================ */
.seq-live {
  width: 100vw;
  position: relative;
  left: 50%;
  right: 50%;
  margin-left: -50vw;
  margin-right: -50vw;
  padding: clamp(40px, 6vw, 100px) 0 clamp(40px, 6vw, 100px);
}
/* Dark theme — Acoma's voice: deep black, photos breathe */
.seq-live.theme-dark {
  background: #0d0d0d;
  color: #f0eee6;
}
/* Light theme — Tagtraum's voice: off-white, the same rhythm in daylight */
.seq-live.theme-light {
  background: var(--bg);
  color: var(--ink);
}
.live-track {
  position: relative;
  padding: 0 clamp(40px, 6vw, 120px) clamp(20px, 3vw, 50px);
  display: flex;
  justify-content: center;
}
.live-track .live-img-wrap {
  position: relative;
  cursor: zoom-in;
  overflow: hidden;
  background: #000;
  max-height: calc(100vh - 140px);
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  min-width: 0;
}
.seq-live.theme-light .live-track .live-img-wrap {
  background: transparent;
}
.live-track .live-img-wrap img {
  max-width: 100%;
  max-height: calc(100vh - 140px);
  width: auto;
  height: auto;
  object-fit: contain;
  display: block;
  transition: filter .4s var(--ease), transform .6s var(--ease);
}
.live-track:hover .live-img-wrap img { filter: brightness(1.04); }

/* Pair row — two images side by side, equal share */
.live-track.live-pair {
  gap: clamp(16px, 2vw, 36px);
  align-items: stretch;
}
.live-track.live-pair .live-img-wrap {
  flex: 1 1 0;
  max-height: calc(100vh - 200px);
}
.live-track.live-pair .live-img-wrap img {
  max-height: calc(100vh - 200px);
}

@media (max-width: 860px) {
  .live-track {
    padding: 0 20px clamp(16px, 4vw, 32px);
  }
  .live-track .live-img-wrap,
  .live-track .live-img-wrap img {
    max-height: calc(100vh - 200px);
  }
}


/* ============================================================
   BVG MAP — Berlin U-Bahn network as background, photos pinned
   to selected stations.
   ============================================================ */
.seq-transit {
  width: 100vw;
  position: relative;
  left: 50%;
  right: 50%;
  margin-left: -50vw;
  margin-right: -50vw;
  padding: 0 0 40px 0;
  background: #0a0a0a;
  overflow: visible;
}
.tm-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 11;
  min-height: 800px;
  overflow: visible;
}
.tm-bg-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
.tm-line {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 4.5;
}
/* Düsseldorf Rheinbahn / DB S-Bahn line colours */
.tm-line-u70 { stroke: #00A3D9; }   /* light blue */
.tm-line-u72 { stroke: #00457C; }   /* deep blue */
.tm-line-u73 { stroke: #E18C00; }   /* orange */
.tm-line-u74 { stroke: #C8102E; }   /* red */
.tm-line-u75 { stroke: #E8407A; }   /* pink/magenta */
.tm-line-u76 { stroke: #82B23A; }   /* light green */
.tm-line-u77 { stroke: #6B3FA0; }   /* violet */
.tm-line-u78 { stroke: #F5C800; }   /* yellow */
.tm-line-u79 { stroke: #1A4985; }   /* dark blue */
.tm-line-s1  { stroke: #00A859; }   /* S-Bahn green */
.tm-line-s6  { stroke: #E37222; }   /* S-Bahn orange */
.tm-line-s8  { stroke: #B71F2A; }   /* S-Bahn red */
.tm-line-s11 { stroke: #5C4033; }   /* S-Bahn brown */
.tm-line-s28 { stroke: #51A985; }   /* S-Bahn mint */
.tm-line.dashed { stroke-dasharray: 4 5; opacity: 0.6; }

/* Small station dots — light on dark */
.tm-station {
  fill: rgba(255,255,255,0.85);
  stroke: rgba(0,0,0,0.6);
  stroke-width: 1;
}
/* Station name labels */
.tm-station-label {
  font-family: var(--f-mono);
  font-size: 8px;
  fill: #1c1c1c;
  letter-spacing: 0;
  pointer-events: none;
  user-select: none;
  font-weight: 500;
}

/* Line endpoint badges (e.g. U1, U2 in their rounded box) */
.tm-line-badge {
  fill: #fff;
  stroke: #1c1c1c;
  stroke-width: 1;
}
.tm-line-badge-fill {
  /* per-line solid filled badge */
}
.tm-line-badge-text {
  font-family: var(--f-mono);
  font-size: 9px;
  font-weight: 700;
  fill: #fff;
  text-anchor: middle;
  dominant-baseline: central;
  letter-spacing: 0.05em;
}

/* Photos pinned to specific stations — overlaid on the SVG */
.tm-photo {
  position: absolute;
  cursor: zoom-in;
  background: #111;
  overflow: hidden;
  /* Fixed aspect ratio so layout is predictable regardless of image proportion */
  aspect-ratio: 4 / 5;
  box-shadow:
    0 14px 32px rgba(0, 0, 0, 0.4),
    0 4px 10px rgba(0, 0, 0, 0.2);
  transition: transform .35s var(--ease), box-shadow .35s var(--ease), z-index 0s linear .4s;
  z-index: 5;
  outline: 1px solid rgba(255,255,255,0.08);
}
.tm-photo:hover {
  z-index: 50;
  transform: translateY(-4px) scale(1.05);
  box-shadow:
    0 24px 50px rgba(0, 0, 0, 0.55),
    0 8px 16px rgba(0, 0, 0, 0.28);
  transition: transform .35s var(--ease), box-shadow .35s var(--ease), z-index 0s;
}
.tm-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
/* Per-photo caption removed; project shows images, not labels */
.tm-photo .tm-photo-cap { display: none; }

/* Rhein — soft river path behind the network */
.tm-rhein {
  fill: none;
  stroke: rgba(80, 130, 180, 0.18);
  stroke-width: 60;
  stroke-linecap: round;
}
/* Connector dot + line on dark BG */
.tm-connector {
  stroke: rgba(255,255,255,0.55);
  stroke-width: 1.2;
  fill: none;
  pointer-events: none;
}
.tm-connector-dot {
  fill: rgba(255,255,255,0.85);
  stroke: rgba(0,0,0,0.6);
  stroke-width: 1.5;
  pointer-events: none;
}

/* Title block — hidden, project title appears in the page header above */
.tm-titleblock { display: none; }
.tm-titleblock .ttl {
  color: #fff;
  font-family: var(--f-display);
  font-style: italic;
  text-transform: none;
  letter-spacing: 0.01em;
  font-size: 14px;
}

/* Mobile fallback: show photos in a clean stacked list, no map */
@media (max-width: 860px) {
  .tm-wrap { display: none; }
  .tm-list {
    width: 100%;
    display: flex; flex-direction: column;
    border-top: 1px solid var(--hair);
  }
  .tm-list .tm-row {
    display: flex; flex-direction: column;
    padding: 16px 20px;
    border-bottom: 1px solid var(--hair);
    cursor: zoom-in;
    gap: 8px;
  }
  .tm-list .tm-row .meta {
    font-family: var(--f-mono);
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex; gap: 12px;
  }
  .tm-list .tm-row .meta .num { color: var(--ink); }
  .tm-list .tm-row img { width: 100%; height: auto; display: block; }
  .tm-list .tm-row .ttl {
    font-family: var(--f-display);
    font-style: italic;
    font-size: 16px;
    color: var(--ink-soft);
  }
}
.tm-list { display: none; }


/* ============================================================
   CONSTELLATION — for the Time project.
   Six photos arranged like stars on a dark night sky, with thin
   connecting lines forming an imaginary constellation.
   No timeline, no reading order — the eye wanders.
   ============================================================ */
.seq-constellation {
  width: 100vw;
  position: relative;
  left: 50%;
  right: 50%;
  margin-left: -50vw;
  margin-right: -50vw;
  padding: clamp(40px, 6vh, 80px) 0;
  background: #000;
  overflow: hidden;
}
.cn-wrap {
  position: relative;
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  aspect-ratio: 4 / 3;
  min-height: 700px;
}
/* Faint star field in the background */
.cn-wrap::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1px 1px at 80% 20%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 35% 80%, rgba(255,255,255,0.35), transparent),
    radial-gradient(1px 1px at 90% 50%, rgba(255,255,255,0.4), transparent),
    radial-gradient(0.5px 0.5px at 15% 60%, rgba(255,255,255,0.3), transparent),
    radial-gradient(0.5px 0.5px at 70% 40%, rgba(255,255,255,0.25), transparent),
    radial-gradient(0.5px 0.5px at 50% 15%, rgba(255,255,255,0.3), transparent),
    radial-gradient(0.5px 0.5px at 25% 50%, rgba(255,255,255,0.2), transparent),
    radial-gradient(0.5px 0.5px at 85% 85%, rgba(255,255,255,0.2), transparent);
  pointer-events: none;
}
/* SVG layer with the constellation lines */
.cn-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.cn-line {
  fill: none;
  stroke: rgba(255, 255, 255, 0.18);
  stroke-width: 0.4;
  stroke-linecap: round;
}
.cn-star {
  fill: rgba(255, 255, 255, 0.7);
  stroke: rgba(255, 255, 255, 0.9);
  stroke-width: 0.3;
}
/* Photos as bright stars */
.cn-photo {
  position: absolute;
  cursor: zoom-in;
  background: #050505;
  overflow: hidden;
  aspect-ratio: 4 / 5;
  box-shadow:
    0 0 30px rgba(255, 255, 255, 0.06),
    0 14px 40px rgba(0, 0, 0, 0.65);
  transform: translate(-50%, -50%);
  transition: transform .5s cubic-bezier(0.22, 1, 0.36, 1),
              box-shadow .5s cubic-bezier(0.22, 1, 0.36, 1),
              z-index 0s linear .5s;
  z-index: 5;
}
.cn-photo:hover {
  z-index: 50;
  transform: translate(-50%, -50%) scale(1.08);
  box-shadow:
    0 0 60px rgba(255, 255, 255, 0.18),
    0 24px 60px rgba(0, 0, 0, 0.8);
  transition: transform .35s cubic-bezier(0.22, 1, 0.36, 1),
              box-shadow .35s cubic-bezier(0.22, 1, 0.36, 1),
              z-index 0s;
}
.cn-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: filter .5s ease;
}
.cn-photo:hover img {
  filter: brightness(1.1);
}

/* Title in the corner — quiet */
.cn-title {
  position: absolute;
  bottom: 20px;
  left: 30px;
  z-index: 100;
  font-family: var(--f-mono);
  font-size: 9px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.4);
  display: flex; flex-direction: column;
  gap: 4px;
}
.cn-title .ttl {
  font-family: var(--f-display);
  font-style: italic;
  font-size: 14px;
  letter-spacing: 0.01em;
  text-transform: none;
  color: rgba(255, 255, 255, 0.9);
}

/* Mobile fallback: simple stacked sequence on dark background */
@media (max-width: 720px) {
  .cn-wrap { display: none; }
  .cn-list {
    width: 100%;
    background: #0a0a0a;
    padding: 24px 0;
    display: flex; flex-direction: column;
    gap: 24px;
  }

<script>

/* ---------- helpers ---------- */
const qs  = (s, r = document) => r.querySelector(s);
const el  = (tag, attrs = {}, children = []) => {
  const n = document.createElement(tag);
  for (const k in attrs) {
    if (k === "class") n.className = attrs[k];
    else if (k === "html") n.innerHTML = attrs[k];
    else if (k.startsWith("data-")) n.setAttribute(k, attrs[k]);
    else n[k] = attrs[k];
  }
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null) return;
    n.append(c.nodeType ? c : document.createTextNode(c));
  });
  return n;
};

/* Render an image block. If `image.src` is set, a real <img> is used.
   Otherwise a neutral placeholder with its label is shown.          */
function renderImage(image, extraClass = "") {
  const frame = el("div", { class: "image-frame " + extraClass });
  const block = el("div", {
    class: `image-block ar-${image.ratio}`,
    "data-label": image.label || ""
  });
  if (image.src) {
    const img = el("img", {
      src: image.src,
      alt: image.alt || image.label || "",
      loading: "eager",
      decoding: "async"
    });
    block.append(img);
  }
  frame.append(block);
  return frame;
}

/* Render a sequence block (part of a project's image flow) */
function renderSequenceBlock(block) {
  // Helper — Linus' rule: detect landscape ratios so we can adjust layout
  const isLandscapeRatio = r => {
    if (!r) return false;
    const [a, b] = r.split("-").map(Number);
    return a > b;
  };
  const itemsAllLandscape = items => items && items.length && items.every(i => isLandscapeRatio(i.ratio));

  switch (block.kind) {
    case "full": {
      const sec = el("section", { class: "seq-section full-bleed" });
      // Single landscape → cap to viewport so it fits on a laptop
      if (isLandscapeRatio(block.ratio)) sec.classList.add("single-landscape");
      sec.append(renderImage(block));
      return sec;
    }
    case "single-centered": {
      const sec = el("section", { class: "seq-section centered" });
      if (isLandscapeRatio(block.ratio)) sec.classList.add("single-landscape");
      sec.append(renderImage(block));
      return sec;
    }
    case "pair":
    case "pair-asym-l":
    case "pair-asym-r":
    case "pair-offset-down":
    case "pair-offset-up": {
      const sec = el("section", { class: "seq-section" });
      const mod = block.kind.replace("pair", "").replace(/^-/, "");
      const wrap = el("div", { class: "seq-pair " + mod });
      block.items.forEach(im => wrap.append(renderImage(im)));
      sec.append(wrap);
      return sec;
    }
    case "triple": {
      const sec = el("section", { class: "seq-section" });
      const wrap = el("div", { class: "seq-triple" });
      block.items.forEach(im => wrap.append(renderImage(im)));
      sec.append(wrap);
      return sec;
    }
    case "horizontal": {
      const wrap = el("div", { class: "seq-horizontal" });
      block.items.forEach(im => wrap.append(renderImage(im)));
      return wrap;
    }
    case "grid": {
      // If grid contains landscape items only → max 2 cols, otherwise max 4
      const cls = "seq-grid " + (itemsAllLandscape(block.items) ? "cols-2" : "cols-4");
      const wrap = el("div", { class: cls });
      block.items.forEach(im => wrap.append(renderImage(im)));
      return wrap;
    }
    case "chessboard": {
      return renderChessboard(block.squares);
    }
    case "floorplan": {
      return renderFloorplan(block.rooms);
    }
    case "setlist": {
      return renderLiveSequence(block.sets, block.theme || "dark");
    }
    case "transit-map": {
      return renderTransitMap(block.stations);
    }
    case "constellation": {
      return renderConstellation(block.stars, block.lines);
    }
    case "ein-tag": {
      return renderEinTag(block.entries);
    }
  }
}

/* Render Tiefkühlschimmel as a floor plan — a schematic Berlin flat */
/* Build the unified mobile sequence — used by every special layout
   on screens < 720px. Each item has:
     { src, alt, marker (mono caps, e.g. "E4" or "U1"), sub (italic) }
   Theme can be "light" (default) or "dark" (Acoma + Time). */
function buildMobileSequence(items, theme = "light") {
  const list = el("div", { class: "mobile-seq theme-" + theme });
  items.forEach((it) => {
    const item = el("div", { class: "mobile-seq-item image-frame" });
    const imgWrap = el("div", { class: "mobile-seq-img" });
    if (it.src) imgWrap.append(el("img", { src: it.src, alt: it.alt || "", loading: "eager" }));
    item.append(imgWrap);
    list.append(item);
  });
  return list;
}

function renderFloorplan(rooms) {
  const sec = el("section", { class: "seq-floorplan" });

  const wrap = el("div", { class: "fp-wrap" });

  // Plan grid (the actual rooms)
  const grid = el("div", { class: "fp-grid" });

  // Room sqm fallback values (estimated for visual notation)
  const sqmDefaults = {
    kueche: "12.4",
    wohnzimmer1: "9.8", wohnzimmer2: "21.6", wohnzimmer3: "8.2",
    korridor1: "6.3", korridor2: "7.1",
    bad: "5.4",
    schlafzimmer1: "16.8", schlafzimmer2: "11.2",
    balkon: "4.6"
  };

  rooms.forEach(r => {
    const room = el("div", { class: `fp-room r-${r.id}` });

    // The photo "object" sitting inside the room with margin
    if (r.src) {
      const photo = el("div", {
        class: "fp-photo image-frame"
      });
      photo.append(el("img", {
        src: r.src,
        alt: "",
        loading: "eager"
      }));
      room.append(photo);
    }
    grid.append(room);
  });
  wrap.append(grid);

  // North arrow (top-right of paper)
  const north = el("div", { class: "fp-north" });
  north.innerHTML = `
    <svg viewBox="0 0 14 22" xmlns="http://www.w3.org/2000/svg">
      <polygon points="7,0 14,22 7,17 0,22" fill="currentColor"/>
    </svg>
    <span class="n-letter">N</span>
  `;
  wrap.append(north);

  sec.append(wrap);

  // Mobile fallback — clean editorial sequence, no labels
  sec.append(buildMobileSequence(rooms.map(r => ({
    src: r.src
  })), "light"));

  return sec;
}

/* Render Acoma as a vertical "live concert" sequence —
   big images, dark backdrop, set markers at left margin. */
function renderLiveSequence(sets, theme) {
  theme = theme || "dark";
  const sec = el("section", { class: "seq-live theme-" + theme });

  // Flatten all tracks across all sets, keeping order. We drop the set divider
  // and per-track meta entirely — the user wants images, no reading.
  const tracks = [];
  sets.forEach(set => set.tracks.forEach(t => tracks.push(t)));

  // Walk tracks; consecutive ones flagged `pair: true` get grouped into a
  // 2-up row. Solo tracks render as full-bleed.
  const buildPhoto = t => {
    const wrap = el("div", { class: "live-img-wrap image-frame" });
    if (t.src) {
      wrap.append(el("img", {
        src: t.src,
        alt: t.alt || "",
        loading: "eager",
        decoding: "async"
      }));
    }
    return wrap;
  };
  let i = 0;
  while (i < tracks.length) {
    const t = tracks[i];
    if (t.pair && tracks[i+1] && tracks[i+1].pair) {
      const row = el("div", { class: "live-track live-pair" });
      row.append(buildPhoto(tracks[i]));
      row.append(buildPhoto(tracks[i+1]));
      sec.append(row);
      i += 2;
    } else {
      const row = el("div", { class: "live-track" });
      row.append(buildPhoto(t));
      sec.append(row);
      i += 1;
    }
  }

  // Mobile fallback — same theme, no markers/sub (per "no invented names")
  sec.append(buildMobileSequence(tracks.map(t => ({
    src: t.src, alt: t.alt
  })), theme));

  return sec;
}

/* Render Malen wo es stört as the BVG U-Bahn network plan,
   with photos pinned at selected stations across the map. */
/* Render Malen wo es stört on a stylised Düsseldorf U-Bahn / S-Bahn network.
   The map is the back layer; photos pin to it. No station names, no captions —
   the lines and the photos themselves do the talking. */
/* Düsseldorf Stadtbahn / S-Bahn — simplified network as background.

   photos sit in open zones above/below the network. */
function renderTransitMap(photos) {
  const sec = el("section", { class: "seq-transit" });
  const wrap = el("div", { class: "tm-wrap" });

  const W = 1600, H = 1100;
  const svgNS = "http://www.w3.org/2000/svg";
  const sg = (tag, attrs = {}) => {
    const n = document.createElementNS(svgNS, tag);

  const svg = sg("svg", {
    class: "tm-bg-svg",
    viewBox: `0 0 ${W} ${H}`,
    preserveAspectRatio: "xMidYMid meet"
  });

  // Real-shape Rhein curve as river (decorative, soft)
  const rhein = sg("path", {
    class: "tm-rhein",
    d: "M 380 280 C 480 380, 540 460, 520 560 C 500 640, 560 700, 580 720"
  });
  svg.appendChild(rhein);

  // Stations — coordinates roughly proportional to real Düsseldorf geography.
  // All Y values squeezed into the central band 280–720 so top (0–270) and
  // bottom (730–1100) areas are clear margins for the photo bands.
  const S = {
    // Northern outer ring
    duisburg:        [ 760, 290],
    duisb_buchholz:  [ 760, 320],
    angermund:       [ 800, 350],
    flughafen:       [ 760, 380],

    kaiserswerth:    [ 540, 410],
    lohausen:        [ 600, 430],
    derendorf:       [ 760, 460],

    // Western (Krefeld arm)
    krefeld:         [ 100, 410],

    hochdahl_st:     [ 280, 450],
    hubert_h:        [ 360, 470],

    // West-central
    lorick:          [ 360, 555],
    seestern:        [ 440, 580],
    nikolaus:        [ 360, 620],
    heerdt:          [ 320, 615],
    // CENTRE (the dense cluster)
    nordstr:         [ 740, 510],
    pempelfort:      [ 760, 540],
    hbf:             [ 880, 600],
    hha:             [ 760, 580],     // Heinrich-Heine-Allee
    stadtmitte:      [ 800, 600],
    altstadt:        [ 700, 580],
    poststr:         [ 740, 600],
    oststr:          [ 820, 580],
    wehrhahn:        [ 840, 540],
    // South-central
    bilk:             [ 720, 660],
    oberbilk:         [ 920, 660],
    unterbilk:        [ 660, 650],
    suedfriedhof:     [ 600, 690],
    flingern:         [ 940, 580],
    // Eastern arm
    gerresheim:       [1100, 580],
    eller:            [1080, 660],
    eller_mitte:      [1180, 650],
    vennhausen:       [1140, 610],
    // Southern arm
    universitaet:     [ 700, 720],
    holthausen:       [ 800, 720],
    benrath:          [ 860, 720],
    benrath_betr:     [ 920, 720],
    garath:           [ 980, 720],
    hellerhof:        [ 940, 720],
    reisholz:         [1080, 690],
    hilden:           [1180, 670],
    // Far southern
    langenfeld:       [ 800, 720],
    leverkusen:       [ 740, 720],
    // Far southwestern (Neuss arm)
    neuss_hbf:        [ 240, 670],
    neuss_sued:       [ 280, 685],
    norf:             [ 300, 700],
    dormagen:         [ 320, 715],
    monchengladbach:  [ 100, 670]
  };

  // Lines — each one draws through a sequence of station nodes.
  // Multiple lines on same edge are offset perpendicular for parallel rails.
  // For simplicity here, all share the same path through the centre but with
  // slightly different stroke widths and transparency creating the layered
  // effect. The line colour is what differentiates them.
  const path = (...names) => "M" + names.map(n => S[n].join(",")).join(" L");

  const lines = [
    // S-Bahn (broad arcs)
    { cls: "tm-line-s1",  d: path("duisburg","duisb_buchholz","angermund","flughafen","unterrath","derendorf","hbf","oberbilk","reisholz","benrath","langenfeld","leverkusen") },
    { cls: "tm-line-s6",  d: path("ratingen_mitte","rath","derendorf","hbf","oberbilk","reisholz","hilden") },
    { cls: "tm-line-s8",  d: path("monchengladbach","neuss_hbf","bilk","hbf","flingern","gerresheim") },

    { cls: "tm-line-s28", d: path("kaiserswerth","derendorf","hbf","oberbilk","reisholz") },

    { cls: "tm-line-u70", d: path("krefeld","osterrath","haus_meer","lorick","seestern","altstadt","hha","stadtmitte","oststr","oberbilk","eller","eller_mitte") },
    // U72 — Ratingen → Universität
    { cls: "tm-line-u72", d: path("ratingen_mitte","ratingen_ost","rath","moersenbroich","wehrhahn","hha","stadtmitte","poststr","bilk","universitaet") },

    { cls: "tm-line-u75", d: path("neuss_hbf","heerdt","seestern","altstadt","hha","stadtmitte","hbf","flingern","vennhausen") },

  wrap.appendChild(svg);

    }));

    const styleParts = [
      `left: ${slot.x * 100}%`,
      `width: 12%`
    ];
    if (slot.b !== undefined) {
      styleParts.push(`bottom: ${slot.b * 100}%`);
    } else {
      styleParts.push(`top: ${slot.y * 100}%`);
    }
    const photo = el("a", {
      class: "tm-photo image-frame",
      href: "javascript:void(0)",
      style: styleParts.join('; ')
    });
    if (ph.src) {
      photo.append(el("img", { src: ph.src, alt: "", loading: "eager" }));
    }
    wrap.append(photo);

    // Compute connector after photo lays out
    requestAnimationFrame(() => {
      const wrapRect = wrap.getBoundingClientRect();
      const photoRect = photo.getBoundingClientRect();
      // Photo edge nearest to anchor in viewBox coords
      const pcx = ((photoRect.left + photoRect.width / 2) - wrapRect.left) / wrapRect.width * W;
      const pcy = ((photoRect.top + photoRect.height / 2) - wrapRect.top) / wrapRect.height * H;
      const dx = tx - pcx, dy = ty - pcy;
      const halfW = (photoRect.width / 2) / wrapRect.width * W;
      const halfH = (photoRect.height / 2) / wrapRect.height * H;
      const tEdge = Math.min(Math.abs(halfW / dx), Math.abs(halfH / dy));
      const ex = pcx + dx * tEdge;
      const ey = pcy + dy * tEdge;
      connectorSvg.appendChild(sg("line", {
        class: "tm-connector",
        x1: ex, y1: ey, x2: tx, y2: ty
      }));
    });
  });

  // Title block, bottom-right
  const tb = el("div", { class: "tm-titleblock" });
  tb.innerHTML = `
    <span class="ttl">Malen wo es stört</span>
    <span>Düsseldorf · Rheinbahn</span>
  `;
  wrap.appendChild(tb);

  sec.appendChild(wrap);

  // Mobile fallback
  sec.append(buildMobileSequence(photos.map(p => ({
    src: p.src, alt: p.alt
  })), "dark"));

  return sec;
}

/* Render Time as a horizontal day timeline.
   Six moments hang from the timeline at fictional but plausible times,
   alternating above and below the axis. */
/* Render Time as a constellation — six photos as stars on a dark sky,
   connected by thin lines forming an imaginary constellation.
   Layout is fixed (no time axis): cx/cy in % of wrap, size = photo
   width as % of wrap width. */
function renderConstellation(stars, connectorLines) {
  const sec = el("section", { class: "seq-constellation" });
  const wrap = el("div", { class: "cn-wrap" });

  // SVG layer for the constellation lines
  const svgNS = "http://www.w3.org/2000/svg";
  const sg = (tag, attrs = {}) => {
    const n = document.createElementNS(svgNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };
  const svg = sg("svg", {
    class: "cn-svg",
    viewBox: "0 0 100 100",
    preserveAspectRatio: "none"
  });

  // Draw connecting lines between stars (by index pairs)
  (connectorLines || []).forEach(([a, b]) => {
    const sa = stars[a], sb = stars[b];
    if (!sa || !sb) return;
    svg.appendChild(sg("line", {
      class: "cn-line",
      x1: sa.cx, y1: sa.cy,
      x2: sb.cx, y2: sb.cy
    }));
  });

  // Star points (small bright dots at each photo position)
  stars.forEach(s => {
    svg.appendChild(sg("circle", {
      class: "cn-star",
      cx: s.cx, cy: s.cy, r: 0.4
    }));
  });

  wrap.appendChild(svg);

  // Photos positioned absolutely as stars
  stars.forEach(s => {
    const photo = el("a", {
      class: "cn-photo image-frame",
      href: "#",
      style: `left: ${s.cx}%; top: ${s.cy}%; width: ${s.size}%;`
    });
    photo.addEventListener("click", e => e.preventDefault());
    if (s.src) {
      photo.append(el("img", { src: s.src, alt: s.alt || "", loading: "eager" }));
    }
    wrap.appendChild(photo);
  });

  // Quiet title in the corner
  const title = el("div", { class: "cn-title" });
  title.append(el("span", { class: "ttl" }, "Time"));
  title.append(el("span", {}, "Personal · 2024"));
  wrap.appendChild(title);

  sec.appendChild(wrap);

  // Mobile fallback — unified dark editorial sequence
  sec.append(buildMobileSequence(stars.map(s => ({
    src: s.src, alt: s.alt,
    marker: null,                  // Time is contemplative — no markers
    sub: s.alt
  })), "dark"));

  return sec;
}

/* Render Tagtraum as a vertical day-arc.
   Entries flow top→bottom; consecutive entries with cols:2 pair side by side.
   A thin time-rail on the left shows the day's hours as a quiet anchor.
   Each entry has its own timestamp + italic note above the photo. */
function renderEinTag(entries) {
  const sec = el("section", { class: "seq-eintag" });
  const wrap = el("div", { class: "et-wrap" });

  // Quiet stamp — top right
  const titleStamp = el("div", { class: "et-title" });
  titleStamp.append(el("span", { class: "ttl" }, "Ein Tag"));
  titleStamp.append(el("span", {}, "Tagtraum · 2024"));
  wrap.append(titleStamp);

  // Left rail — thin vertical line + 8 hour ticks at fixed intervals
  const rail = el("div", { class: "et-rail" });
  rail.append(el("div", { class: "et-rail-line" }));
  const marks = el("div", { class: "et-rail-marks" });
  const ticks = ["06:00", "09:00", "12:00", "15:00", "18:00", "21:00", "00:00", "03:00"];
  ticks.forEach((t, i) => {
    const top = (i / (ticks.length - 1)) * 100;
    const tick = el("div", { class: "et-tick", style: `top: ${top}%;` });
    tick.append(el("span", {}, t));
    marks.append(tick);
  });
  rail.append(marks);
  wrap.append(rail);

  // Build a single entry (meta + photo)
  const buildEntry = e => {
    const entry = el("article", { class: "et-entry" });
    const meta = el("header", { class: "et-meta" });
    meta.append(el("span", { class: "et-time" }, e.time));
    if (e.note) meta.append(el("span", { class: "et-note" }, e.note));
    entry.append(meta);

    const photo = el("div", { class: "et-photo image-frame" });
    const block = el("div", { class: `image-block ar-${e.ratio}`, "data-label": "" });
    if (e.src) {
      block.append(el("img", {
        src: e.src,
        alt: e.alt || "",
        loading: "eager",
        decoding: "async"
      }));
    }
    photo.append(block);
    entry.append(photo);
    return entry;
  };

  // Flow column — group consecutive cols:2 entries into pair rows
  const flow = el("div", { class: "et-flow" });
  const isLandscape = r => {
    if (!r) return false;
    const [a, b] = r.split("-").map(Number);
    return a > b;
  };
  let i = 0;
  while (i < entries.length) {
    const e = entries[i];
    if (e.cols === 2 && entries[i+1] && entries[i+1].cols === 2) {
      const row = el("div", { class: "et-row pair" });
      row.append(buildEntry(entries[i]));
      row.append(buildEntry(entries[i+1]));
      flow.append(row);
      i += 2;
    } else {
      const row = el("div", { class: "et-row single" + (isLandscape(e.ratio) ? " single-landscape" : "") });
      row.append(buildEntry(e));
      flow.append(row);
      i += 1;
    }
  }
  wrap.append(flow);

  sec.append(wrap);

  // Mobile fallback — unified light editorial sequence with time markers
  sec.append(buildMobileSequence(entries.map(e => ({
    src: e.src, alt: e.alt,
    marker: e.time,                // "08:14"
    sub: e.note                    // "kaum wach"
  })), "light"));

  return sec;
}

/* Render the Schach project as a chess board.
   Each entry in `squares` is { sq: "e4", src, alt }. */
function renderChessboard(squares) {
  const sec = el("section", { class: "seq-chessboard" });

  const wrap = el("div", { class: "cb-wrap" });
  // ranks 8 → 1
  const ranks = el("div", { class: "cb-ranks" });
  for (let r = 8; r >= 1; r--) ranks.append(el("span", {}, String(r)));
  wrap.append(ranks);
  // files a → h
  const files = el("div", { class: "cb-files" });
  ["a","b","c","d","e","f","g","h"].forEach(f => files.append(el("span", {}, f)));
  wrap.append(files);

  // The board itself
  const board = el("div", { class: "cb-board" });
  for (let r = 8; r >= 1; r--) {
    for (let fi = 0; fi < 8; fi++) {
      const file = "abcdefgh"[fi];
      const sqId = file + r;
      const isLight = (fi + r) % 2 === 1; // a1 dark
      const sqEl = el("div", { class: "cb-square " + (isLight ? "" : "dark"), "data-sq": sqId });
      const placement = squares.find(s => s.sq === sqId);
      if (placement) {
        const piece = el("div", {
          class: "cb-piece image-frame",
          "data-title": placement.alt || "",
          "data-sq": sqId
        });
        const img = el("img", {
          src: placement.src,
          alt: placement.alt || "",
          loading: "eager",
          decoding: "async"
        });
        piece.append(img);
        sqEl.append(piece);
      }
      board.append(sqEl);
    }
  }
  wrap.append(board);
  sec.append(wrap);

  // Mobile fallback — unified editorial sequence with notation markers
  sec.append(buildMobileSequence(squares.map(s => ({
    src: s.src,
    marker: s.sq.toUpperCase()      // chess notation only, no invented names
  })), "light"));

  return sec;
}

function bindIndexPreview() {
  const preview = qs("#indexPreview");
  const block = preview.querySelector(".image-block");
  const rows = document.querySelectorAll(".index-row");
  rows.forEach(r => {
    const slug = r.dataset.slug;
    const project = PROJECTS.find(p => p.slug === slug);
    if (!project) return;
    r.addEventListener("mouseenter", () => {
      block.className = `image-block ar-${project.cover.ratio}`;
      block.setAttribute("data-label", project.cover.label || "");
      // Put the actual cover image inside the preview block
      block.innerHTML = "";
      if (project.cover.src) {
        const img = document.createElement("img");
        img.src = project.cover.src;
        img.alt = project.cover.alt || project.title;
        block.appendChild(img);
      }
      preview.classList.add("visible");
    });
    r.addEventListener("mouseleave", () => preview.classList.remove("visible"));
    r.addEventListener("mousemove", e => {
      const x = Math.min(window.innerWidth - 300, e.clientX + 24);
      const y = Math.min(window.innerHeight - 380, e.clientY - 180);
      preview.style.transform = `translate(${x}px, ${y}px)`;
    });
  });
}

/* ---------- Router ---------- */
function render() {
  const hash = location.hash || "#/";
  const path = hash.slice(1); // remove leading #
  const main = qs("#main");
  main.innerHTML = "";

  let view;
  if (path === "/" || path === "") view = pageHome();
  else if (path === "/index") view = pageIndex();
  else if (path === "/about") view = pageAbout();
  else if (path === "/contact") view = pageContact();
  else if (path === "/impressum") view = pageImpressum();
  else if (path.startsWith("/projects/")) view = pageProject(path.replace("/projects/", ""));
  else view = pageNotFound();

  main.append(view);
  window.scrollTo(0, 0);
  updateActiveNav();
  closeMobileNav();
}

function updateActiveNav() {
  const path = location.hash || "#/";
  document.querySelectorAll(".nav a[data-link]").forEach(a => {
    const match = a.getAttribute("href") === path ||
                  (a.getAttribute("href") === "#/index" && path.startsWith("#/projects/"));
    a.classList.toggle("active", !!match);
  });
}

document.addEventListener("click", e => {
  const a = e.target.closest("a[data-link]");
  if (!a) return;
  // allow cmd/ctrl-click to open new tab
  if (e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  const href = a.getAttribute("href");
  if (href === location.hash) return;
  location.hash = href;
});

window.addEventListener("hashchange", render);
window.addEventListener("load", render);

/* nav scroll style */
window.addEventListener("scroll", () => {
  qs("#nav").classList.toggle("scrolled", window.scrollY > 20);
});

/* mobile menu */
qs("#navToggle").addEventListener("click", () => qs("#nav").classList.toggle("open"));
function closeMobileNav() { qs("#nav").classList.remove("open"); }

/* =====================================================================
   LIGHTBOX INIT
   Click any image on the page to open full-size (object-fit: contain),
   keyboard + swipe navigation through all visible images.
   ===================================================================== */
(function initLightbox() {
  const lb = document.createElement("div");
  lb.className = "lightbox";
  lb.setAttribute("aria-hidden", "true");
  lb.innerHTML = `
    <button class="lb-close" aria-label="Close">×</button>
    <button class="lb-prev" aria-label="Previous">‹</button>
    <button class="lb-next" aria-label="Next">›</button>
    <div class="lb-counter"></div>
    <div class="lb-stage"><img alt="" /></div>
    <div class="lb-caption"></div>
  `;
  document.body.appendChild(lb);
  const lbImg = lb.querySelector(".lb-stage img");
  const lbCap = lb.querySelector(".lb-caption");
  const lbCounter = lb.querySelector(".lb-counter");
  const btnClose = lb.querySelector(".lb-close");
  const btnPrev  = lb.querySelector(".lb-prev");
  const btnNext  = lb.querySelector(".lb-next");

  let items = [];       // [{src, alt}]
  let index = 0;

  function show(i) {
    if (!items.length) return;
    index = (i + items.length) % items.length;
    const it = items[index];
    lbImg.src = it.src;
    lbImg.alt = it.alt || "";
    lbCap.textContent = "";    // no caption — images speak for themselves
    lbCounter.textContent = items.length > 1 ? `${index + 1} / ${items.length}` : "";
    // pre-load neighbours for snappy navigation
    if (items.length > 1) {
      [1, -1].forEach(d => {
        const n = items[(index + d + items.length) % items.length];
        if (n) { const p = new Image(); p.src = n.src; }
      });
    }
  }
  function open(i) {
    show(i);
    lb.classList.add("open");
    lb.setAttribute("aria-hidden", "false");
    document.body.classList.add("lightbox-open");
  }
  function close() {
    lb.classList.remove("open");
    lb.setAttribute("aria-hidden", "true");
    document.body.classList.remove("lightbox-open");
    // clear after transition
    setTimeout(() => { lbImg.src = ""; }, 320);
  }
  function next() { show(index + 1); }
  function prev() { show(index - 1); }

  // Click delegation: open lightbox on image-frame click
  document.addEventListener("click", e => {
    // Close handlers when open
    if (lb.classList.contains("open")) {
      if (e.target === btnClose || btnClose.contains(e.target)) { e.preventDefault(); close(); return; }
      if (e.target === btnNext  || btnNext.contains(e.target))  { e.preventDefault(); next();  return; }
      if (e.target === btnPrev  || btnPrev.contains(e.target))  { e.preventDefault(); prev();  return; }
      // Click on backdrop (anything but the image itself)
      if (!lbImg.contains(e.target)) { close(); return; }
      return;
    }
    // Open on image-frame click — ONLY within project detail sequences.
    // Covers on home/index are navigation links, not lightbox triggers.
    const frame = e.target.closest(".image-frame");
    if (!frame) return;
    const inSequence = frame.closest(".seq");
    if (!inSequence) return;
    const clickedImg = frame.querySelector("img");
    if (!clickedImg) return;
    // Special context handling: chessboard / floorplan / setlist all have
    // their own self-contained image collections so lightbox cycles only
    // through their pieces, in the order they appear in the layout.
    // On mobile (< 720px), every layout uses the unified .mobile-seq list.
    const cbContext = frame.closest(".seq-chessboard");
    const fpContext = frame.closest(".seq-floorplan");
    const slContext = frame.closest(".seq-live");
    const tmContext = frame.closest(".seq-transit");
    const cnContext = frame.closest(".seq-constellation");
    const etContext = frame.closest(".seq-eintag");
    const ctx = cbContext || fpContext || slContext || tmContext || cnContext || etContext;
    let allImgs;
    if (ctx) {
      // Detect if we're on mobile by checking which sub-layout is visible.
      // The .mobile-seq is hidden on desktop via media query.
      const mobileList = ctx.querySelector(".mobile-seq");
      const onMobile = mobileList && mobileList.offsetParent !== null;
      if (onMobile) {
        allImgs = Array.from(ctx.querySelectorAll(".mobile-seq img"));
      } else if (cbContext) {
        allImgs = Array.from(cbContext.querySelectorAll(".cb-piece img"));
      } else if (fpContext) {
        allImgs = Array.from(fpContext.querySelectorAll(".fp-photo img"));
      } else if (slContext) {
        allImgs = Array.from(slContext.querySelectorAll(".live-img-wrap img"));
      } else if (tmContext) {
        allImgs = Array.from(tmContext.querySelectorAll(".tm-photo img"));
      } else if (cnContext) {
        allImgs = Array.from(cnContext.querySelectorAll(".cn-photo img"));
      } else if (etContext) {
        allImgs = Array.from(etContext.querySelectorAll(".et-photo img"));
      }
    } else {
      allImgs = Array.from(inSequence.querySelectorAll(".image-frame img"));
    }
    items = allImgs.map(i => ({ src: i.src, alt: i.alt || "" }));
    const i = allImgs.indexOf(clickedImg);
    if (i >= 0) open(i);
  });

  // Keyboard
  document.addEventListener("keydown", e => {
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape")     close();
    else if (e.key === "ArrowRight") next();
    else if (e.key === "ArrowLeft")  prev();
  });

  // Touch swipe (mobile)
  let touchX = null, touchY = null;
  lb.addEventListener("touchstart", e => {
    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;
  }, { passive: true });
  lb.addEventListener("touchend", e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    const dy = e.changedTouches[0].clientY - touchY;
    touchX = touchY = null;
    // ignore vertical swipes
    if (Math.abs(dy) > Math.abs(dx)) return;
    if (Math.abs(dx) < 50) return;
    if (dx < 0) next(); else prev();
  }, { passive: true });
})();

</script>

</body>
